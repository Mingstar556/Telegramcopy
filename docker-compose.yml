services:
  postgres:
    image: postgres:16-alpine
    container_name: tbot_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbotchat}
      POSTGRES_USER: ${POSTGRES_USER:-tbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbot_secret_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbot} -d ${POSTGRES_DB:-tbotchat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tbot_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbot_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tbot}:${POSTGRES_PASSWORD:-tbot_secret_password_2026}@postgres:5432/${POSTGRES_DB:-tbotchat}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-tbot_enterprise_production_secret_key_change_me_99}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-True}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 backend.asgi:application"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tbot_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
